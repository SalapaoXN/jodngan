spring:
  application:
    name: jodngan-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jodngan}
    username: ${DB_USERNAME:jodngan}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
