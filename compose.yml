services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-jodngan}
      POSTGRES_USER: ${DB_USERNAME:-jodngan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    ports:
      - "5432:5432"
    volumes:
      - jodngan_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jodngan} -d ${DB_NAME:-jodngan}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jodngan_postgres_data:
